name: dejavu
repo: https://github.com/WhiteBite/opencode-dejavu
tagline: Cross-session error gates for recurring tool-call failures
description: Mechanically detects recurring tool-call failures (3 failures across 2 distinct sessions) and promotes them into enforced gates — reminder on the next attempt, hard block on same-session repeat offense. Two-scope store (project gates escalate to global after 2+ project dirs), secret scrubbing before persistence, blocking policy limited to non-diagnostic bash commands, 60-day TTL expiry, doctor/analyze/migrate scripts, companion agent skill and /dejavu status command. Distinct from "deja" (BM25 session indexing): dejavu enforces gates on repeatedly failing tool calls.
scope:
  - global
  - project
tags:
  - memory
  - error-gates
  - reliability
  - cross-session
  - safety
installation: |
  git clone https://github.com/WhiteBite/opencode-dejavu ~/.config/opencode/vendor/dejavu && cd ~/.config/opencode/vendor/dejavu && bun install
  Then create ~/.config/opencode/plugins/dejavu.ts with: export { Dejavu } from "../vendor/dejavu/index.ts"